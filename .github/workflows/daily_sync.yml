name: Daily Multi-Source Sync

on:
  schedule:
    - cron: '0 15 * * *'  # 毎日 0:00 JST (= 15:00 UTC)
  workflow_dispatch:       # 手動実行も可能

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # 優先度1: スプシ（最優先）
      - name: Sync from Google Sheets
        run: python backend/sync_from_sheet.py
        env:
          PYTHONIOENCODING: utf-8

      # 優先度2: fananablog.com
      - name: Sync from fananablog.com
        run: python backend/sync_fananablog.py
        env:
          PYTHONIOENCODING: utf-8

      # 優先度3: oshitabi.net（最低優先）
      - name: Sync from oshitabi.net
        run: python backend/sync_oshitabi.py
        env:
          PYTHONIOENCODING: utf-8

      # 変更があればまとめてコミット
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/pineapple_paws.db \
                  backend/sync_state_fananablog.json \
                  backend/sync_state_oshitabi.json
          if git diff --cached --quiet; then
            echo "変更なし、スキップします"
          else
            git commit -m "Auto sync: $(date '+%Y-%m-%d') 自動更新"
            git push
          fi
